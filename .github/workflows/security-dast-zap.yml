name: DAST - OWASP ZAP

on:
  workflow_call:

permissions:
  contents: read
  security-events: write
  issues: write
  checks: write

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fix permissions for ZAP Docker
        run: chmod -R 777 .

      - name: Start FastAPI application
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          # Esperamos de forma inteligente hasta que el puerto responda
          echo "Waiting for service to start..."
          timeout 30s bash -c 'until curl -s http://localhost:8000 > /dev/null; do sleep 2; done'
          echo "Service is UP!"

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:8000"
          fail_action: false
          allow_issue_writing: false
          cmd_options: "-J zap_report.json"

      - name: Convert ZAP JSON report to SARIF
        if: always() # Ejecutar aunque el escaneo encuentre fallos
        run: |
          npm install -g zap-sarif
          zap-sarif zap_report.json --output zap-scan-results.sarif

      - name: Upload ZAP Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: zap-scan-results.sarif
          category: zap-dast
