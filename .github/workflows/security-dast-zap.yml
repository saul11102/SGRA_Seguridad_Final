name: DAST - OWASP ZAP

on:
  workflow_call:

permissions:
  contents: read
  security-events: write
  issues: write
  checks: write

jobs:
  zap-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pydantic[email]"

      - name: Start FastAPI application
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" > .env
          # Iniciar app en background
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 20

      - name: Fix permissions for Docker
        run: |
          chmod -R 777 .

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:8000"
          fail_action: false
          cmd_options: "-a"

      - name: Listar archivos generados
        run: ls -la

      - name: Fix permissions for Upload (Post-scan)
        if: always()
        run: sudo chmod -R 777 .

      - name: Upload ZAP Report to Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() # Ejecutar incluso si ZAP encuentra fallos
        with:
          sarif_file: zap-scan-results.sarif
